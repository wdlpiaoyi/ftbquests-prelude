# ---------------------------------------------------------------------------
# Gradle / JVM
# ---------------------------------------------------------------------------
# Minecraft 1.20.1 Forge requires Java 17. This repository intentionally does
# NOT set org.gradle.java.home, because that must be a machine specific absolute
# path and would break the build for anyone else who clones this repository.
#
# If your default "java" is not 17, use the local launcher instead:
#     gradlew-jdk17.bat <tasks>
# See gradlew-jdk17.bat.example and the README.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.2.19
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings. Default channels: official, parchment.
mapping_channel=official
mapping_version=1.20.1

# ---------------------------------------------------------------------------
# Mod
# ---------------------------------------------------------------------------
# Must fit the regex [a-z][a-z0-9_]{1,63} and match the @Mod annotation value.
mod_id=ftbquests_prelude
# The human-readable display name for the mod.
mod_name=FTB Quests: Prelude
# Review your options at https://choosealicense.com/
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=0.1.0
# Should match the base package used for the mod sources.
mod_group_id=dev.wdlpiaoyi.ftbquestsprelude
# Used for display purposes in the mod list.
mod_authors=wdlpiaoyi
mod_description=An unofficial addon for FTB Quests on Minecraft 1.20.1 (Forge).

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
# Target FTB Quests release for Minecraft 1.20.1 (matches the Reference source).
ftbquests_version=2001.4.22
ftbquests_version_range=[2001.4.0,)
# FTB Quests' required libraries at that release.
ftblibrary_version=2001.2.9
ftbteams_version=2001.3.0
architectury_version=9.1.12

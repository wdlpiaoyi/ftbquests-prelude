plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required for this template to work: runs processResources on IDE output.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    // FTB mods (FTB Quests, FTB Library, FTB Teams) live on the FTB maven.
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content {
            includeGroup 'dev.ftb.mods'
        }
    }
    // Architectury API, required by FTB Quests.
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'CreeperHost'
        url = 'https://maven.creeperhost.net/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor: generates ftbquests_prelude.refmap.json.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // FTB Quests and its required libraries. fg.deobf() remaps the published
    // artifacts into the development mappings so we can compile against them
    // and actually run the mod in the dev environment.
    implementation fg.deobf("dev.ftb.mods:ftb-quests-forge:${ftbquests_version}")
    implementation fg.deobf("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}")
    implementation fg.deobf("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}")
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
}

// Mixin: register the refmap and the mixin config. MixinGradle injects the config
// into the dev run configurations and adds a MixinConfigs manifest entry to the jar.
mixin {
    add sourceSets.main, 'ftbquests_prelude.refmap.json'
    config 'ftbquests_prelude.mixins.json'
}

// Expand declared properties into mods.toml / pack.mcmeta.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            ftbquests_version_range: ftbquests_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
